# golangci-lint v2 configuration.
#
# The default `max-same-issues=3` / `max-issues-per-linter=50` caps hide
# repeated findings (e.g. 100+ identical errcheck messages), so full runs
# are the only trustworthy signal here. Run with:
#
#   golangci-lint run ./...
version: "2"

run:
  timeout: 5m

issues:
  # Report every occurrence; never truncate.
  max-issues-per-linter: 0
  max-same-issues: 0
  # Findings already carry per-line positions; no dedup by line.
  uniq-by-line: false
