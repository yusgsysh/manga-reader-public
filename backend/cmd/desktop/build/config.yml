version: '3'

info:
  companyName: "Manga Reader"
  productName: "Manga Reader"
  productIdentifier: "com.manga.reader"
  description: "Manga Reader desktop application"
  copyright: "(c) 2025, Manga Reader"
  comments: "Manga Reader desktop application"
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
