name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------
  # Backend: gofmt / vet / test
  # ------------------------------------------------------------
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          UNFORMATTED="$(gofmt -l . || true)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # ------------------------------------------------------------
  # Frontend: install / lint / unit tests / production build
  # ------------------------------------------------------------
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  # ------------------------------------------------------------
  # Single image — built only when all tests above succeeded.
  # The frontend bundle is compiled and embedded into the Go binary
  # by the root Dockerfile, so API + static files ship together.
  #
  # push to main / manual run:
  #   pushed to ghcr.io/<owner>/manga-reader
  #
  # pull_request:
  #   built as validation only, not pushed
  # ------------------------------------------------------------
  docker:
    name: Build Docker Image
    needs:
      - backend-test
      - frontend-test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    timeout-minutes: 30

    outputs:
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Image name (lowercase namespace)
        id: base
        run: |
          set -euo pipefail
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/manga-reader" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.base.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=manga-reader
          cache-to: type=gha,scope=manga-reader,mode=max
          provenance: false
          sbom: false

  # ------------------------------------------------------------
  # Job summary — commit metadata, per-job results, image tags.
  # Runs even when an earlier job failed or was skipped.
  # ------------------------------------------------------------
  summary:
    name: Job Summary
    needs:
      - backend-test
      - frontend-test
      - docker

    if: always()

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Write job summary
        env:
          BACKEND_RESULT: ${{ needs.backend-test.result }}
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          IMAGE_TAGS: ${{ needs.docker.outputs.tags }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login || github.actor }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}

        run: |
          set -euo pipefail

          # Keep free-form values from breaking the markdown tables.
          esc() { printf '%s' "$1" | tr '|\n' '/ '; }

          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="${SERVER_URL}/${REPO}/commit/${COMMIT_SHA}"
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          {
            echo "## CI Summary"
            echo
            echo "### Commit"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Commit | [\`${SHORT_SHA}\`](${COMMIT_URL}) |"
            echo "| Author | $(esc "${COMMIT_AUTHOR:-unknown}") |"
            echo "| Branch | \`$(esc "${REF_NAME}")\` |"
            echo "| Trigger | \`${EVENT_NAME}\` |"
            if [[ -n "${PR_NUMBER:-}" ]]; then
              echo "| Pull request | [#${PR_NUMBER}](${SERVER_URL}/${REPO}/pull/${PR_NUMBER}) |"
            fi
            echo "| Run | [#${RUN_NUMBER} attempt ${RUN_ATTEMPT}](${RUN_URL}) |"
            echo
            if [[ -n "${COMMIT_MESSAGE:-}" ]]; then
              echo "Commit message:"
              echo
              printf '%s\n' "$COMMIT_MESSAGE" | sed 's/^/    /'
              echo
            fi
            echo "### Jobs"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Backend Tests | ${BACKEND_RESULT} |"
            echo "| Frontend Tests | ${FRONTEND_RESULT} |"
            echo "| Build Docker Image | ${DOCKER_RESULT} |"
            if [[ -n "${IMAGE_TAGS:-}" ]]; then
              echo
              echo "### Image tags"
              echo
              printf '%s\n' "$IMAGE_TAGS" | sed 's/^/    /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
