name: Native desktop

# Tests and builds the mygo desktop app for macOS, Linux and Windows on every
# push, and attaches the binaries to a GitHub release when a v* tag is pushed.
#
# Nothing here needs a GUI toolkit at build time: mygo loads GTK 3 and
# WebKitGTK at run time with purego (dlopen), and the app itself draws
# through Metal, Direct3D 11 or OpenGL, so the whole program cross-compiles
# with CGO_ENABLED=0. The toolkit packages are only a user's runtime
# dependency, documented in the desktop README, not a builder's.

on:
  push:
    branches:
      - mygo
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One list for every job: the binary is one file, and the version string is
  # what the settings page shows under 关于.
  APP_NAME: manga-reader
  GOFLAGS: -trimpath

jobs:
  test:
    name: Test and vet (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          UNFORMATTED="$(gofmt -l . || true)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The timing assertions skip themselves under -race, where the detector
      # slows every frame by an order of magnitude.
      - name: Race detector
        run: go test -race ./internal/cache/... ./cmd/desktop-native/...

      # The cross-compiles below prove the code builds for the other two
      # platforms; the tests can only run for the host's.
      - name: Cross-compile check (no artifacts)
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -o /dev/null ./cmd/desktop-native
            echo "ok: $target"
          done

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-14
            ext: ""
            archive: zip
          - goos: darwin
            goarch: amd64
            runner: macos-14
            ext: ""
            archive: zip
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
            archive: zip
    # macOS and Windows run on their own hosts: the binary is the user's to
    # run, and only a matching host can smoke-test it.
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # -ldflags -X main.version: the settings page's 关于 row, from the
          # tag when this is a release and the commit otherwise.
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          NAME="${APP_NAME}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${NAME}" ./cmd/desktop-native
          # An absolute path: the packaging step changes directory, and the
          # name read back from GITHUB_ENV must still resolve.
          echo "NAME=$(pwd)/${NAME}" >> "$GITHUB_ENV"
          ls -lh "${NAME}"

      # Only a host can smoke-test a GUI binary, and none of these runners
      # has a display; check that it is a valid executable of its platform.
      - name: Check the binary (Unix)
        if: matrix.goos != 'windows'
        shell: bash
        run: file "${NAME}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # The docs travel with the binary, so a downloaded archive explains
          # itself. They are staged outside the checkout, so nothing pollutes
          # the working tree.
          STAGE="${{ runner.temp }}/stage"
          ARCHIVE_BASE="${APP_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "${NAME}" "$STAGE/"
          cp ../README.md "$STAGE/README.md"
          cp cmd/desktop-native/README.md "$STAGE/README-desktop.md"
          cp ../MYGO_MIGRATION.md "$STAGE/MYGO_MIGRATION.md"
          # The icon and desktop entry travel with the binary; INSTALL.md
          # explains how to put them in place (a real .deb/AppImage is
          # still on the todo list).
          mkdir -p "$STAGE/linux"
          cp cmd/desktop-native/assets/icon.png "$STAGE/linux/manga-reader.png"
          cp cmd/desktop-native/assets/manga-reader.desktop "$STAGE/linux/manga-reader.desktop"
          cp cmd/desktop-native/assets/INSTALL.md "$STAGE/INSTALL.md"

          # Pack into a file outside the staged dir, so the archive never
          # includes itself while it is being written.
          #
          # The command belongs to the host: zip is not on a Windows runner's
          # Git Bash (there is no zip.exe there), and no runner is promised
          # zip on macOS either, so the Windows and macOS archives use what
          # each platform ships.
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            ARCHIVE="${ARCHIVE_BASE}.zip"
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              # Compress-Archive ships with the runner, and Windows' own
              # Explorer opens what it writes. -Force quotes the paths for
              # PowerShell (the temp path holds no quote); the -Path wildcard
              # skips dotfiles, which the binary, the docs and the icon are
              # not.
              ZIP_DIR="${STAGE//\'/\'\'}"
              ZIP_OUT="${STAGE//\'/\'\'}/$ARCHIVE"
              powershell -NoProfile -NonInteractive -Command \
                "Compress-Archive -Path '${ZIP_DIR}/*' -DestinationPath '${ZIP_OUT}' -Force"
            else
              # ditto is the macOS archiver: it keeps the resource forks and
              # permissions and stamps the archive with them.
              ZIP_DIR="${STAGE//\'/\'\'}"
              ZIP_OUT="${STAGE//\'/\'\'}/$ARCHIVE"
              # A list of what landed in the archive shows in the log, so a
              # release's contents are visible without downloading it.
              ditto -c -k --sequesterRsrc --keepParent "$ZIP_DIR" "$ZIP_OUT"
              unzip -l "$ZIP_OUT"
            fi
          else
            ARCHIVE="${ARCHIVE_BASE}.tar.gz"
            tar -czf "$STAGE/$ARCHIVE" -C "$STAGE" \
              "${NAME##*/}" README.md README-desktop.md MYGO_MIGRATION.md \
              INSTALL.md linux
          fi
          # The artifact path is relative to the workspace, where the upload
          # step looks for it.
          mv "$STAGE/$ARCHIVE" "${GITHUB_WORKSPACE}/backend/"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          ls -lh "${GITHUB_WORKSPACE}/backend/${ARCHIVE}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: backend/${{ env.ARCHIVE }}
          retention-days: 14
          if-no-files-found: error

  release:
    name: Attach binaries to the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The one job that writes: it creates the release the tag names.
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: the notes compare against the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          # Notes are generated from the commits since the previous tag; the
          # migration TODO is a development document, not release copy.
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          TITLE="Manga Reader ${GITHUB_REF_NAME}"
          if [[ -n "$PREV" ]]; then
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --title "$TITLE" --generate-notes \
              --notes-start-tag "$PREV" --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --title "$TITLE" --generate-notes --verify-tag
          fi
