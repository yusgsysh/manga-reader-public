name: Desktop

# Builds the Wails desktop app on Linux and Windows.
# This branch uses Wails v2 (`wails build`); feat/wails-v3 carries the same
# workflow driven by `wails3` plus an Android APK job.

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '.github/workflows/desktop.yml'
      - 'backend/**'
      - 'frontend/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/desktop.yml'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash
        working-directory: backend/cmd/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Add GOPATH/bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies (GTK3 + webkit2gtk 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install MinGW (Windows C toolchain for Wails)
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress

      - name: Install Wails v2 CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build desktop app
        run: wails build

      - name: Upload desktop app
        uses: actions/upload-artifact@v7
        with:
          name: manga-reader-desktop-${{ matrix.os }}
          path: backend/cmd/desktop/build/bin/manga-reader-desktop*
          if-no-files-found: error
          retention-days: 14
