info:
  name: Cached Gallery Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/gallery-cache/:id/:token/details"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: ["200", "404"]
  scripts:
    - type: tests
      code: |-
        test("returns cached details or 404 when not cached", function () {
          if (res.status === 200) {
            expect(res.body).to.have.property("title");
            expect(res.body).to.have.property("cover");
            expect(res.getHeader("cache-control")).to.equal("no-store");
          } else {
            expect(res.status).to.equal(404);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Read-only cached gallery detail snapshot. Same shape as
  **Gallery Detail (Scraped)**; uncached fields (`domain`, `parent`,
  `visible`) come back as zero values. Never touches the upstream; returns
  `404` when nothing is cached.

  Errors: 404 not cached, 503 cache database not configured.
