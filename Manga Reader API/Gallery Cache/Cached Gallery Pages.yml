info:
  name: Cached Gallery Pages
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/gallery-cache/:id/:token/pages"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: ["200", "404"]
  scripts:
    - type: tests
      code: |-
        test("returns cached pages or 404 when not cached", function () {
          if (res.status === 200) {
            expect(res.body.pages).to.be.an("array");
            expect(res.body.total).to.equal(res.body.pages.length);
            expect(res.getHeader("cache-control")).to.equal("no-store");
          } else {
            expect(res.status).to.equal(404);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Read-only cached page URL list. Same shape as **Gallery Pages**. Never
  touches the upstream; returns `404` when nothing is cached. Feed a
  `page_url` into **Page Image** / **Cached Image** for offline reading.

  Errors: 404 not cached, 503 cache database not configured.
