info:
  name: Popular
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/popular"
  params:
    - name: page
      value: "0"
      type: query
      description: Page number (0-indexed); only page 0 has data

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.results
      operator: isArray
  scripts:
    - type: tests
      code: |-
        test("returns a result array", function () {
          expect(res.body.results).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Popular gallery list. Only the first page contains data.
