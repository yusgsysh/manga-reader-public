info:
  name: Watched
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/watched"
  params:
    - name: page
      value: "0"
      type: query
      description: Page number (0-indexed)
    - name: seek
      value: "2020"
      type: query
      description: "Jump/Seek: date to seek to (YYYY, YY-MM or YYYY-MM-DD)"
      disabled: true
    - name: jump
      value: "1y"
      type: query
      description: "Jump/Seek: relative offset (e.g. 3d, 1w, 6m, 1y)"
      disabled: true
    - name: min_pages
      value: "10"
      type: query
      description: Minimum page count (>= 0)
      disabled: true
    - name: max_pages
      value: "200"
      type: query
      description: Maximum page count (>= 0)
      disabled: true
    - name: min_rating
      value: "4"
      type: query
      description: Minimum rating (2, 3, 4 or 5)
      disabled: true
    - name: has_torrent
      value: "true"
      type: query
      description: Only show galleries with a torrent
      disabled: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.results
      operator: isArray
  scripts:
    - type: tests
      code: |-
        test("returns a result array", function () {
          expect(res.body.results).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Galleries matching the watched tags. Returns an empty list when no watched
  tags are configured.

  `seek` / `jump` provide the upstream Jump/Seek positioning; the response
  includes a `nav` object with the prev/next cursors and date range metadata.
