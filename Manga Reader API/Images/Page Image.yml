info:
  name: Page Image
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/image/page"
  params:
    - name: url
      value: "{{pageUrl}}"
      type: query
      description: Page URL from the gallery pages list

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("responds with an image content type", function () {
          expect(res.getHeader("content-type")).to.match(/^image\//);
        });

        test("uses a short cache window", function () {
          expect(res.getHeader("cache-control")).to.include("max-age=3600");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Live proxy for the raw ExHentai page image bytes (no MinIO). Retries up to 2
  times on upstream failure; a failed download returns HTTP 502.

  Cached variant: **Cached Page Image** (`/api/image-cache/page`).
