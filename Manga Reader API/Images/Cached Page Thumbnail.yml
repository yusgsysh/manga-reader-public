info:
  name: Cached Page Thumbnail
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/image-cache/page-thumbnail"
  params:
    - name: url
      value: "{{spriteUrl}}"
      type: query
      description: Sprite image URL (direct crop mode)
    - name: x
      value: "0"
      type: query
      description: Crop origin X (>= 0)
    - name: y
      value: "0"
      type: query
      description: Crop origin Y (>= 0)
    - name: w
      value: "200"
      type: query
      description: Crop width (1..4096)
    - name: h
      value: "282"
      type: query
      description: Crop height (1..4096)
    - name: id
      value: "{{galleryId}}"
      type: query
      description: Gallery ID (index mode; use instead of url+rect)
      disabled: true
    - name: token
      value: "{{galleryToken}}"
      type: query
      description: Gallery token (index mode)
      disabled: true
    - name: index
      value: "0"
      type: query
      description: Page index (index mode)
      disabled: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("responds with a webp image", function () {
          expect(res.getHeader("content-type")).to.equal("image/webp");
        });

        test("is immutably cacheable", function () {
          expect(res.getHeader("cache-control")).to.include("max-age=31536000");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  MinIO-backed page thumbnail crop (read-through). Same addressing as
  **Page Thumbnail**:

  - `url` + `x`/`y`/`w`/`h`: sprite cached under `page-sprite/<sha256(url)>`,
    crop under `page-thumb/<sha256(url|x|y|w|h)>`.
  - `id` + `token` + `index`: geometry from `gallery_cache`, scraping upstream
    on a miss.

  Errors: 400 invalid parameters; 404 not found; 502 upstream failure; 503 cache
  not configured.
