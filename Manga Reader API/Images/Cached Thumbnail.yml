info:
  name: Cached Thumbnail
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/cached-thumbnail"
  params:
    - name: url
      value: "{{thumbnailUrl}}"
      type: query
      description: Thumbnail URL from the cover / thumbnail field

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("responds with image bytes", function () {
          expect(res.getHeader("content-type")).to.match(/^image\//);
        });

        test("is immutably cacheable", function () {
          expect(res.getHeader("cache-control")).to.include("max-age=31536000");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Thumbnail proxy backed by a MinIO cache. Objects are stored under the
  `thumbnail/` prefix keyed by `sha256(full thumbnail URL)`, so changing the URL
  never pollutes old entries. Concurrent misses are de-duplicated (singleflight).

  Errors: 400 invalid/missing url, 502 upstream failure, 503 cache not configured.
  Same URL whitelist and SSRF protection as **Thumbnail**.
