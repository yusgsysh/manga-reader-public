info:
  name: Prefill Get
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/prefill/:id"
  params:
    - name: id
      value: "{{prefillId}}"
      type: path
      description: Prefill job ID

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isNumber
    - expression: res.body.status
      operator: isString
  scripts:
    - type: tests
      code: |-
        test("returns the requested job", function () {
          expect(String(res.body.id)).to.equal(bru.getVar("prefillId"));
        });

        test("progress is exposed only while running", function () {
          if (res.body.status === "running") {
            expect(res.body.progress).to.be.an("object");
            expect(res.body.progress).to.have.property("done");
          } else {
            expect(res.body.progress).to.equal(null);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Poll a single prefill job. `progress` (`{done, cached, fetched}`) is only
  present for a `running` job in the current process; otherwise it is `null`.

  Errors: 400 invalid id, 404 not found.
