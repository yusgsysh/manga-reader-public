info:
  name: Bookshelf Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/bookshelf/:id/:token/status"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.in_bookshelf
      operator: isBoolean
  scripts:
    - type: tests
      code: |-
        test("reports membership and (when present) created_at", function () {
          expect(res.body).to.have.property("in_bookshelf");
          if (res.body.in_bookshelf) {
            expect(res.body).to.have.property("created_at");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Check whether a gallery is in the bookshelf. When present, `created_at` is an
  RFC3339 timestamp.
