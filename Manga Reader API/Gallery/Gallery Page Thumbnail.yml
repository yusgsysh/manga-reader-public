info:
  name: Gallery Page Thumbnail
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/gallery/:id/:token/page-thumbnail"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token
    - name: index
      value: "0"
      type: query
      description: Page index (0-indexed)

runtime:
  assertions:
    - expression: res.status
      operator: in
      value: ["200", "404"]
  scripts:
    - type: tests
      code: |-
        test("returns a webp image when the page exists", function () {
          if (res.status === 200) {
            expect(res.getHeader("content-type")).to.equal("image/webp");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fetch a single page thumbnail addressed by gallery id/token + page index,
  without first calling **Gallery Pages**. The server locates the sprite,
  crops the cell and returns WebP.

  Uses `pages[].thumbnail` from `gallery_cache` when present, otherwise scrapes
  only the thumbnail page containing the index. Crops share the MinIO cache with
  **Page Thumbnail**.

  Errors: 400 invalid index; 404 index out of range / no thumbnail metadata;
  502 upstream failure.
