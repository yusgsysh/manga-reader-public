info:
  name: Gallery Detail (Scraped)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/gallery/:id/:token/details"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isNumber
    - expression: res.body.page_count
      operator: isNumber
    - expression: res.body.tags
      operator: isArray
  scripts:
    - type: tests
      code: |-
        test("returns scrape-only fields", function () {
          expect(res.body).to.have.property("domain");
          expect(res.body).to.have.property("cover");
          expect(res.body).to.have.property("visible");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Scrape the gallery detail page. A single upstream request returns the first
  gallery page; use **Gallery Pages** for the full page URL list.

  On success the result is written to `gallery_cache`. This endpoint never
  falls back; the offline fallback lives in the **Gallery Cache** folder
  (`GET /api/gallery-cache/:id/:token/details`).
