info:
  name: Gallery Detail (Official API)
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/gallery/:id/:token"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isNumber
    - expression: res.body.token
      operator: isString
    - expression: res.body.tags
      operator: isArray
  scripts:
    - type: tests
      code: |-
        test("returns the gallery identity", function () {
          expect(res.body.id).to.equal(Number(bru.getEnvVar("galleryId")));
          expect(res.body.token).to.equal(bru.getEnvVar("galleryToken"));
        });

        test("tags are namespaced objects", function () {
          res.body.tags.forEach(function (tag) {
            expect(tag).to.have.property("namespace");
            expect(tag).to.have.property("name");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Fetch gallery metadata from the official ExHentai API.

  On success the result is written to `gallery_cache`. This endpoint never
  falls back; the offline fallback lives in the **Gallery Cache** folder
  (`GET /api/gallery-cache/:id/:token`).
