info:
  name: Gallery Pages
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/gallery/:id/:token/pages"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.total
      operator: isNumber
    - expression: res.body.pages
      operator: isArray
  scripts:
    - type: tests
      code: |-
        test("page count matches the pages array length", function () {
          expect(res.body.pages.length).to.equal(res.body.total);
        });

        test("pages are indexed and expose page_url", function () {
          res.body.pages.forEach(function (page, index) {
            expect(page.index).to.equal(index);
            expect(page.page_url).to.include("exhentai.org");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Return the ordered list of page URLs for a gallery. Feed a `page_url` into
  **Page Image**, **Cached Image** or **Start Prefill**.

  On success the list is written to `gallery_cache`. This endpoint never
  falls back; the offline fallback lives in the **Gallery Cache** folder
  (`GET /api/gallery-cache/:id/:token/pages`).
