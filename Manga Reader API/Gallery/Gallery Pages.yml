info:
  name: Gallery Pages
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/gallery/:id/:token/pages"
  params:
    - name: id
      value: "{{galleryId}}"
      type: path
      description: Gallery ID
    - name: token
      value: "{{galleryToken}}"
      type: path
      description: Gallery token

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds with an NDJSON stream", function () {
          expect(res.status).to.equal(200);
          expect(res.getHeader("content-type")).to.include("application/x-ndjson");
          expect(res.getHeader("cache-control")).to.equal("no-store");
        });

        test("meta line first, pages indexed, done line last", function () {
          var lines = String(res.body).trim().split("\n").map(function (line) {
            return JSON.parse(line);
          });

          var meta = lines[0];
          expect(meta.type).to.equal("meta");
          expect(meta.id).to.exist;
          expect(meta.token).to.exist;

          var pages = lines.filter(function (line) {
            return line.type === "page";
          });
          pages.forEach(function (page, index) {
            expect(page.index).to.equal(index);
            expect(page.page_url).to.include("exhentai.org");
          });

          var last = lines[lines.length - 1];
          expect(last.type).to.equal("done");
          expect(last.total).to.equal(pages.length);
          if (meta.total > 0) {
            expect(pages.length).to.be.at.least(meta.total);
          }
        });

        test("exposes sprite thumbnail geometry when available", function () {
          var pages = String(res.body).trim().split("\n").map(function (line) {
            return JSON.parse(line);
          }).filter(function (line) {
            return line.type === "page" && line.thumbnail;
          });

          pages.forEach(function (page) {
            expect(page.thumbnail.sprite_url).to.include("http");
            expect(page.thumbnail.width).to.be.a("number");
            expect(page.thumbnail.height).to.be.a("number");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Return the ordered list of page URLs for a gallery as a **streaming NDJSON**
  response (`application/x-ndjson`): a `meta` line (id/token/total), one `page`
  line per page as soon as it is scraped, then a terminal `done` line — or an
  `error` line when scraping fails midway, in which case every `page` line
  received so far must be discarded.

  Feed a `page_url` into **Page Image**, **Cached Image** or **Start Prefill**.

  Each `page` line may also carry a `thumbnail` object (`sprite_url`, `x`, `y`,
  `width`, `height`) describing where the page thumbnail lives inside the
  gallery sprite; feed it into **Page Thumbnail**.

  On a fully successful scrape the list is written to `gallery_cache`; any
  failure writes nothing (no partial cache entries). This endpoint never falls
  back; the offline fallback lives in the **Gallery Cache** folder
  (`GET /api/gallery-cache/:id/:token/pages`, plain JSON).
