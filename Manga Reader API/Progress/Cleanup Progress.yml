info:
  name: Cleanup Progress
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/reading-progress/cleanup"
  params:
    - name: days
      value: "{{cleanupDays}}"
      type: query
      description: Delete records older than N days; 0 deletes all

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.days
      operator: isNumber
    - expression: res.body.deleted
      operator: isNumber
  scripts:
    - type: tests
      code: |-
        test("realises the requested retention window", function () {
          expect(res.body.days).to.equal(30);
          expect(res.body.deleted).to.be.at.least(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Delete reading progress records. This is the only endpoint that removes
  progress; `/api/recently-read` never triggers cleanup.

  `days` defaults to 30 and must be a non-negative integer (HTTP 400 otherwise).
  Only `reading_progress` is affected; bookshelf and cached images are untouched.
