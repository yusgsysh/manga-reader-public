name: Native desktop

# Builds the mygo desktop app on all three platforms it supports. Linux needs
# GTK3 at build time (the ui package draws through cgo on Linux), macOS and
# Windows build with the pure Go backends.
#
# The binary is a single file: the API runs in-process and the UI is drawn by
# mygo's ui package, so there is nothing to install next to it.

on:
  push:
    branches:
      - mygo
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and vet (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK3 and X11 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          UNFORMATTED="$(gofmt -l . || true)"
          if [[ -n "$UNFORMATTED" ]]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Race detector (cache, app, instance lock)
        run: go test -race ./internal/cache/... ./cmd/desktop-native/...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            deps: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        if: matrix.deps != ''
        run: ${{ matrix.deps }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # The whole program, ui and API both, cross-compiles from any host: the
      # desktop packages (cache, config, single instance) and the app are pure
      # Go.
      - name: Cross-build the app packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" ./cmd/desktop-native/app/... ./cmd/desktop-native/internal/... ./internal/...
          echo "ok: app, desktop internals and backend cross-compile for $GOOS/$GOARCH"
          if [[ "$GOOS" == "windows" ]]; then
            go vet ./cmd/desktop-native/app/... ./cmd/desktop-native/internal/... ./internal/...
          fi

      - name: Check the full binary (host toolchain only)
        if: matrix.goos == 'linux'
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o "manga-reader-linux-$GOARCH" ./cmd/desktop-native
          ls -lh "manga-reader-linux-$GOARCH"

      - name: Upload binary
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: manga-reader-linux-${{ matrix.goarch }}
          path: backend/manga-reader-linux-${{ matrix.goarch }}
          retention-days: 14
