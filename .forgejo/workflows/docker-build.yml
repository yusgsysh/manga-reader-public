name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  REGISTRY: git.09270721.xyz

  # Single image: Gin API + the frontend bundle embedded at build time.
  IMAGE: git.09270721.xyz/abc/manga-reader

  # Docker Compose deployment
  DEPLOY_PATH: /root/manga-reader-public

jobs:
  # ------------------------------------------------------------
  # Detect which parts changed
  # ------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: self-hosted

    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      image: ${{ steps.changes.outputs.image }}
      any: ${{ steps.changes.outputs.any }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------
          # Determine comparison range
          #
          # push:
          #   Compare before -> after so multiple commits are handled.
          #
          # pull_request:
          #   Compare PR base -> HEAD.
          # ------------------------------------------------------

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            # First push / unusual event where before is all zeros
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            fi
          fi

          echo "Comparing:"
          echo "  BASE: $BASE_SHA"
          echo "  HEAD: $HEAD_SHA"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # ------------------------------------------------------
          # Frontend
          # ------------------------------------------------------
          if echo "$CHANGED_FILES" | grep -qE '^frontend/'; then
            FRONTEND=true
          else
            FRONTEND=false
          fi

          # ------------------------------------------------------
          # Backend
          # ------------------------------------------------------
          if echo "$CHANGED_FILES" | grep -qE '^backend/'; then
            BACKEND=true
          else
            BACKEND=false
          fi

          # ------------------------------------------------------
          # Image build definition (root Dockerfile embeds the frontend)
          # ------------------------------------------------------
          if echo "$CHANGED_FILES" | grep -qE '^(Dockerfile|\.dockerignore)$'; then
            IMAGE=true
          else
            IMAGE=false
          fi

          if [[ "$FRONTEND" == "true" || "$BACKEND" == "true" || "$IMAGE" == "true" ]]; then
            ANY=true
          else
            ANY=false
          fi

          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"

          echo
          echo "Change detection:"
          echo "  frontend: $FRONTEND"
          echo "  backend:  $BACKEND"
          echo "  image:    $IMAGE"
          echo "  any:      $ANY"

  # ------------------------------------------------------------
  # Build and push the single image
  # ------------------------------------------------------------
  build-and-push:
    name: Build and Push
    needs: detect-changes

    if: needs.detect-changes.outputs.any == 'true'

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Buildx
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ----------------------------------------------------------
      # Login to Forgejo Container Registry
      # ----------------------------------------------------------
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ----------------------------------------------------------
      # Frontend bundle + backend binary in one image (root Dockerfile)
      #
      # Registry cache:
      #
      #   image:
      #     manga-reader:latest
      #
      #   cache:
      #     manga-reader:buildcache
      #
      # This works independently from GitHub Actions Cache.
      # ----------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          tags: |
            ${{ env.IMAGE }}:latest

          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache

          cache-to: |
            type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

          provenance: false
          sbom: false

  # ------------------------------------------------------------
  # Deploy
  # ------------------------------------------------------------
  deploy:
    name: Deploy
    needs:
      - detect-changes
      - build-and-push

    # Only deploy successful pushes to main.
    #
    # PR:
    #   build only
    #
    # main push:
    #   build -> deploy
    #
    # No frontend/backend changes:
    #   no build -> no deploy
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.any == 'true'

    runs-on: self-hosted

    steps:
      - name: Deploy with Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

          sshpass -p "$DEPLOY_PASSWORD" \
            ssh \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=10 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "
                set -e

                cd '${DEPLOY_PATH}'

                echo '==> Pull images'
                docker compose pull

                echo '==> Restart services'
                docker compose up -d --remove-orphans

                echo '==> Service status'
                docker compose ps
              "
