name: Build and Push Docker Image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: git.09270721.xyz

  # Single image: Gin API + the frontend bundle embedded at build time.
  IMAGE: git.09270721.xyz/abc/manga-reader

  # Docker Compose deployment
  DEPLOY_PATH: /root/manga-reader-public

jobs:
  # ------------------------------------------------------------
  # Detect which parts changed
  # ------------------------------------------------------------
  detect-changes:
    name: Detect Changes
    runs-on: self-hosted

    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
      image: ${{ steps.changes.outputs.image }}
      any: ${{ steps.changes.outputs.any }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------
          # Determine comparison range
          #
          # push:
          #   Compare before -> after so multiple commits are handled.
          #
          # pull_request:
          #   Compare PR base -> HEAD.
          # ------------------------------------------------------

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"

            # First push / unusual event where before is all zeros
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA")"
            fi
          fi

          echo "Comparing:"
          echo "  BASE: $BASE_SHA"
          echo "  HEAD: $HEAD_SHA"

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # ------------------------------------------------------
          # Frontend
          # ------------------------------------------------------
          if echo "$CHANGED_FILES" | grep -qE '^frontend/'; then
            FRONTEND=true
          else
            FRONTEND=false
          fi

          # ------------------------------------------------------
          # Backend
          # ------------------------------------------------------
          if echo "$CHANGED_FILES" | grep -qE '^backend/'; then
            BACKEND=true
          else
            BACKEND=false
          fi

          # ------------------------------------------------------
          # Image build definition (root Dockerfile embeds the frontend)
          # ------------------------------------------------------
          if echo "$CHANGED_FILES" | grep -qE '^(Dockerfile|\.dockerignore)$'; then
            IMAGE=true
          else
            IMAGE=false
          fi

          if [[ "$FRONTEND" == "true" || "$BACKEND" == "true" || "$IMAGE" == "true" ]]; then
            ANY=true
          else
            ANY=false
          fi

          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"

          echo
          echo "Change detection:"
          echo "  frontend: $FRONTEND"
          echo "  backend:  $BACKEND"
          echo "  image:    $IMAGE"
          echo "  any:      $ANY"

  # ------------------------------------------------------------
  # Build and push the single image
  # ------------------------------------------------------------
  build-and-push:
    name: Build and Push
    needs: detect-changes

    if: needs.detect-changes.outputs.any == 'true'

    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Buildx
      # ----------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # ----------------------------------------------------------
      # Login to Forgejo Container Registry
      # ----------------------------------------------------------
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # ----------------------------------------------------------
      # Frontend bundle + backend binary in one image (root Dockerfile)
      #
      # Registry cache:
      #
      #   image:
      #     manga-reader:latest
      #     manga-reader:<sha>   (rollback / pinning)
      #
      #   cache:
      #     manga-reader:buildcache
      #
      # One writer only: the build cache is imported by every run but exported
      # only from main pushes, so concurrent PR builds cannot overwrite each
      # other's cache with a partially-warm result.
      #
      # This works independently from GitHub Actions Cache. BuildKit also
      # reuses the cache mounts declared in the Dockerfile (Bun downloads,
      # Go build cache) from the persistent self-hosted builder.
      # ----------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # PR runs validate the image; they must not move `latest`.
          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache

          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

          provenance: false
          sbom: false

  # ------------------------------------------------------------
  # Deploy
  # ------------------------------------------------------------
  deploy:
    name: Deploy
    needs:
      - detect-changes
      - build-and-push

    # Only deploy successful pushes to main.
    #
    # PR:
    #   build only
    #
    # main push:
    #   build -> deploy
    #
    # No frontend/backend changes:
    #   no build -> no deploy
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect-changes.outputs.any == 'true'

    runs-on: self-hosted

    steps:
      - name: Deploy with Docker Compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

        shell: bash
        run: |
          set -euo pipefail

          echo "Deploying to ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_OPTS=(-o ConnectTimeout=10)
          if [ -n "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            SSH_OPTS+=(-o StrictHostKeyChecking=yes)
          else
            SSH_OPTS+=(-o StrictHostKeyChecking=accept-new)
          fi

          if [ -n "${DEPLOY_SSH_KEY:-}" ]; then
            ( umask 077; printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key )
            SSH=(ssh -i ~/.ssh/deploy_key "${SSH_OPTS[@]}")
          else
            # Password fallback: pass the secret via the environment instead
            # of argv, where any local process could read it.
            SSH=(sshpass -e ssh "${SSH_OPTS[@]}")
          fi

          SSHPASS="${DEPLOY_PASSWORD:-}" "${SSH[@]}" \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "
                set -e

                cd '${DEPLOY_PATH}'

                echo '==> Pull images'
                docker compose pull

                echo '==> Restart services'
                docker compose up -d --remove-orphans

                echo '==> Service status'
                docker compose ps
              "
