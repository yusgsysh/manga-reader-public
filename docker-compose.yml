# Manga Reader - Docker Compose
#
# 前置：复制 .env.example 为 .env 并配置 ExHentai Cookie。
#
# 启动：
#   docker compose up -d
#
# 更新镜像：
#   docker compose pull
#   docker compose up -d
#
# 拓扑（单镜像）：
#   backend (Gin :8080, 对外发布 5173)
#     ├── 静态前端（构建时 embed 进二进制，不外挂静态文件）
#     ├── /api/* 与 SPA 回退同进程处理
#     ├── HTTP Basic Auth（可选，MANGA_READER_BASIC_AUTH_*，默认关闭）
#     └── 数据卷 backend_data → /app/data
#
# 公网部署：Basic Auth 必须开启且置于 HTTPS 之后；PostgreSQL / MinIO
# 默认仅绑定回环地址，不发布公网端口（见 README「公网部署」）。
# 需要局域网访问时，显式改成 "0.0.0.0:5173:8080"，并务必开启 Basic Auth +
# HTTPS 反向代理；生产环境（ENVIRONMENT=production）未开启 Basic Auth 会拒绝启动。

services:
  backend:
    image: ghcr.io/yusgsysh/manga-reader:latest

    init: true

    env_file:
      - .env

    ports:
      - "127.0.0.1:5173:8080"

    environment:
      # 生产模式：未开启 Basic Auth 时后端拒绝启动（fail closed）。
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # 容器内必须监听所有接口，宿主侧由 ports 的 127.0.0.1 限制。
      EHENTAI_PORT: ":8080"
      MANGA_READER_DB_PATH: /app/data/manga-reader.db

      # Go 堆软上限（见 Dockerfile 注释）：接近上限时 GC 加速回收，
      # 尖峰后 RSS 回落。镜像默认 160MiB，可用 .env 覆盖。
      GOMEMLIMIT: ${GOMEMLIMIT:-160MiB}

      # HTTP Basic Auth（Gin 层，默认关闭；生产在 .env 开启）
      # 注意：.env 中的 $ 需写成 $$（compose 会做变量插值）
      MANGA_READER_BASIC_AUTH_ENABLED: ${MANGA_READER_BASIC_AUTH_ENABLED:-false}
      MANGA_READER_BASIC_AUTH_USERNAME: ${MANGA_READER_BASIC_AUTH_USERNAME:-}
      MANGA_READER_BASIC_AUTH_PASSWORD: ${MANGA_READER_BASIC_AUTH_PASSWORD:-}
      # 口令/htpasswd 文件经 secret 注入时设置（见文件末尾 secrets 示例）
      MANGA_READER_BASIC_AUTH_FILE: ${MANGA_READER_BASIC_AUTH_FILE:-}
      MANGA_READER_BASIC_AUTH_PASSWORD_FILE: ${MANGA_READER_BASIC_AUTH_PASSWORD_FILE:-}

      # HTTP 代理（出站走代理，.env 中的 HTTP_PROXY/HTTPS_PROXY/NO_PROXY）
      # 未设置时为空，Go 视为未配置代理即直连
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

    volumes:
      - backend_data:/app/data

    # 局域网内 MinIO / EhTagTranslation 等主机名解析（按需修改）
    # extra_hosts:
    #   - "storage.09270721.xyz:192.168.1.100"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  backend_data:

# ------------------------------------------------------------
# 生产环境 Basic Auth 推荐：口令不进 .env / 容器环境，而是以
# htpasswd 文件（apr1 $1$ 或 bcrypt $2$ 哈希）经 docker secret 注入：
#
#   1) 宿主机生成（交互输入口令，不落命令行历史）：
#        mkdir -p secrets
#        htpasswd -nm admin > secrets/manga_reader.htpasswd
#   2) .env 中设置：
#        MANGA_READER_BASIC_AUTH_ENABLED=true
#        MANGA_READER_BASIC_AUTH_FILE=/run/secrets/manga_reader_htpasswd
#   3) 取消下面的注释：
#
# secrets:
#   manga_reader_htpasswd:
#     file: ./secrets/manga_reader.htpasswd
#
#   并在 backend 服务下追加：
#     secrets:
#       - manga_reader_htpasswd
# ------------------------------------------------------------
