# Manga Reader - Docker Compose
#
# 前置：复制 .env.example 为 .env，设置 JWT_SECRET 与初始管理员密码。
# ExHentai Cookie 按用户在应用「设置」中配置。
#
# 启动：
#   docker compose up -d
#
# 更新镜像：
#   docker compose pull
#   docker compose up -d
#
# 拓扑（单镜像）：
#   backend (Gin :8080, 对外发布 5173)
#     ├── 静态前端（构建时 embed 进二进制，不外挂静态文件）
#     ├── /api/* 与 SPA 回退同进程处理
#     ├── JWT 多用户认证（JWT_SECRET 必填）
#     ├── Node API Key 节点同步 / 监控认证（数据库管理，管理员创建）
#     ├── Metrics Token / metrics:read 节点 Key / 回环限制
#     └── 数据卷 backend_data → /app/data
#
# 公网部署：JWT 登录必须置于 HTTPS 之后；PostgreSQL / MinIO 默认仅绑定回环地址，
# 不发布公网端口（见 README「公网部署」）。

services:
  backend:
    image: ghcr.io/yusgsysh/manga-reader:latest

    init: true

    env_file:
      - .env

    ports:
      - "127.0.0.1:5173:8080"

    environment:
      # 容器内必须监听所有接口，宿主侧由 ports 的 127.0.0.1 限制。
      EHENTAI_PORT: ":8080"
      MANGA_READER_DB_PATH: /app/data/manga-reader.db

      # JWT 用户登录（多用户，必填）
      # 生成密钥：openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-manga-reader}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MANGA_READER_AUTH_COOKIE_SECURE: ${MANGA_READER_AUTH_COOKIE_SECURE:-auto}

      # Metrics 内部接口（独立 Token；未设置时仅回环访问，或使用 metrics:read 节点 Key）
      MANGA_READER_METRICS_ENABLED: ${MANGA_READER_METRICS_ENABLED:-true}
      MANGA_READER_METRICS_TOKEN: ${MANGA_READER_METRICS_TOKEN:-}

      # 节点同步（API Key 在数据库管理，不使用环境变量）
      MANGA_READER_SYNC_ENABLED: ${MANGA_READER_SYNC_ENABLED:-true}
      MANGA_READER_SYNC_REQUEST_TIMEOUT: ${MANGA_READER_SYNC_REQUEST_TIMEOUT:-30s}
      MANGA_READER_SYNC_API_KEY_MIN_LENGTH: ${MANGA_READER_SYNC_API_KEY_MIN_LENGTH:-32}

      # HTTP 代理（出站走代理，.env 中的 HTTP_PROXY/HTTPS_PROXY/NO_PROXY）
      # 未设置时为空，Go 视为未配置代理即直连
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}

      # ZIP 归档存储（可选，独立于图片缓存，见 .env.example）
      ZIP_ENABLED: ${ZIP_ENABLED:-false}
      ZIP_PROVIDER: ${ZIP_PROVIDER:-minio}
      ZIP_ENDPOINT: ${ZIP_ENDPOINT:-}
      ZIP_REGION: ${ZIP_REGION:-}
      ZIP_BUCKET: ${ZIP_BUCKET:-}
      ZIP_ACCESS_KEY: ${ZIP_ACCESS_KEY:-}
      ZIP_SECRET_KEY: ${ZIP_SECRET_KEY:-}
      ZIP_USE_SSL: ${ZIP_USE_SSL:-true}
      ZIP_PREFIX: ${ZIP_PREFIX:-archives/}
      ZIP_CONCURRENCY: ${ZIP_CONCURRENCY:-4}
      ZIP_PART_SIZE: ${ZIP_PART_SIZE:-}
      ZIP_PRESIGN_DOWNLOAD: ${ZIP_PRESIGN_DOWNLOAD:-false}
      ZIP_PRESIGN_EXPIRY: ${ZIP_PRESIGN_EXPIRY:-15m}

    volumes:
      - backend_data:/app/data

    # 局域网内 MinIO / EhTagTranslation 等主机名解析（按需修改）
    # extra_hosts:
    #   - "storage.09270721.xyz:192.168.1.100"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Classic (non-swarm) resource keys: `deploy.resources.limits` conflicts
    # with `pids_limit` in recent Compose versions.
    pids_limit: 512
    cpus: "1.0"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  backend_data:
