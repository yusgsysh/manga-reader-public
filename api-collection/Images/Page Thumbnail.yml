info:
  name: Page Thumbnail
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/image/page-thumbnail"
  params:
    - name: url
      value: "{{spriteUrl}}"
      type: query
      description: Sprite image URL (direct crop mode)
    - name: x
      value: "0"
      type: query
      description: Crop origin X (>= 0)
    - name: y
      value: "0"
      type: query
      description: Crop origin Y (>= 0)
    - name: w
      value: "200"
      type: query
      description: Crop width (1..4096)
    - name: h
      value: "282"
      type: query
      description: Crop height (1..4096)
    - name: id
      value: "{{galleryId}}"
      type: query
      description: Gallery ID (index mode; use instead of url+rect)
      disabled: true
    - name: token
      value: "{{galleryToken}}"
      type: query
      description: Gallery token (index mode)
      disabled: true
    - name: index
      value: "0"
      type: query
      description: Page index (index mode)
      disabled: true

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("responds with a webp image", function () {
          expect(res.getHeader("content-type")).to.equal("image/webp");
        });

        test("uses a short cache window", function () {
          expect(res.getHeader("cache-control")).to.include("max-age=3600");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Live crop of a single page thumbnail from the ExHentai sprite image (no
  MinIO). Two addressing modes:

  - `url` + `x`/`y`/`w`/`h` from `pages[].thumbnail`.
  - `id` + `token` + `index` (server scrapes the sprite geometry).

  Errors: 400 missing/invalid parameters, disallowed URL or out-of-bounds crop;
  404 index out of range; 502 upstream failure.

  Cached variant: **Cached Page Thumbnail** (`/api/image-cache/page-thumbnail`).
