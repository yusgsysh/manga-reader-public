# Manga Reader Frontend - nginx 部署配置（方案 A：托管前端 + 反代 /api）
#
# 用法：
#   1. 构建生产产物（使用 .env.production，VITE_API_BASE_URL 为空 → 同源）
#        bun run build
#   2. 将 dist/ 复制到服务器，例如 /var/www/manga-reader/dist
#   3. 复制本文件到 /etc/nginx/sites-available/manga-reader
#       sudo cp deploy/nginx.conf /etc/nginx/sites-available/manga-reader
#   4. 按需修改 server_name、root、proxy_pass 后端地址
#   5. 启用并重载：
#       sudo ln -s /etc/nginx/sites-available/manga-reader /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name example.com;

    root /var/www/manga-reader/dist;
    index index.html;

    # 后端 API 反代（同机用 127.0.0.1，后端在别处则改成对应地址）
    location /api/ {
        proxy_pass http://127.0.0.1:30080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 大图代理需要较长超时
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # cached-image / cached-thumbnail 返回二进制，禁用缓冲更稳
        proxy_buffering off;
    }

    # SPA 路由回退（/recently-read、/reader/:id/:token 等不落盘的路由）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # db.text.js（EhTagTranslation 翻译库）同源加载
    location = /db.text.js {
        expires 1d;
        add_header Cache-Control "public";
    }
}
